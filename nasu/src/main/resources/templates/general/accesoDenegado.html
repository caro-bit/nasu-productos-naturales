<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <!-- Página a la que Spring Security envía cuando el rol no alcanza -->
        <section class="container pt-5">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6 text-center">
                    <i class="fa-solid fa-lock fa-3x text-nasu mb-3"></i>
                    <h2>[[#{usuario.acceso.denegado.titulo}]]</h2>
                    <p class="lead text-muted">[[#{usuario.acceso.denegado}]]</p>
                    <a th:href="@{/}" class="btn btn-nasu">
                        <i class="fa-solid fa-house"></i> [[#{plantilla.inicio}]]
                    </a>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
